<div
  class="header flex flex-row h-16 md:h-24 justify-between items-center px-8 bg-white bg-opacity-30 backdrop-blur-md p-6 shadow-lg text-gray-900">
  <div class="text-4xl font-bold flex items-center gap-2"><img class="h-6" src="suisse.png"/>Bailo</div>
  <div class="flex flex-row items-center gap-4">
    @if (subscriptionStatus) {
      <button type="button"
              class="subscription-tag"
              [class.subscription-tag--cta]="isSubscriptionCta()"
              [class.subscription-tag--clickable]="isSubscriptionCta()"
              [ngClass]="subscriptionStatusClass"
              (click)="onSubscriptionTagClick($event)">
        <span class="subscription-tag__label">Abonnement</span>
        @if (isSubscriptionCta()) {
          <span class="subscription-tag__value">Activer Premium</span>
        } @else {
          <span class="subscription-tag__value">{{ subscriptionStatus | subscriptionStatus }}</span>
        }
      </button>
    }
    <div class="flex flex-row items-center gap-4"
         appMenuTrigger
         [appMenuTriggerFor]="menu">
    @if (user?.picture) {
      <div class="h-10 w-10 rounded-full overflow-hidden flex justify-center items-center bg-gray-200">
        <img [src]="user?.picture" alt="User" class="h-full w-full object-cover"/>
      </div>
    } @else {
      <div class="h-10 w-10 bg-red-600 rounded-full flex justify-center items-center text-xl text-white font-semibold">
        {{ user?.given_name?.charAt(0) }} {{ user?.family_name?.charAt(0) }}
      </div>
    }
    <div class="font-semibold hidden md:block">{{ user?.given_name }} {{ user?.family_name }}</div>
    </div>
  </div>

</div>

<!-- Menu -->
<app-menu #menu="appMenu">
  @if (shouldShowGoPremium()) {
    <button appMenuItem (click)="goPremium()" class="premium-menu-item">
      <lucide-icon [img]="FlameIcon"></lucide-icon>
      <span class="premium-menu-item__content">
        <span class="premium-menu-item__title">Passez en Premium</span>
        <span class="premium-menu-item__hint">Debloquez toutes les fonctions avancees</span>
      </span>
      <span class="premium-menu-item__badge">PRO</span>
    </button>
  }
  @if (shouldShowCustomerPortal()) {
    <button appMenuItem (click)="openCustomerPortal()">
      <lucide-icon [img]="UserIcon"></lucide-icon>
      Gerer mon abonnement
    </button>
  }
  <button appMenuItem (click)="logout()">
    <lucide-icon [img]="LogOutIcon"></lucide-icon>
    Deconnexion
  </button>
</app-menu>
