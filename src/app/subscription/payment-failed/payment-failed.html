<div class="min-h-[calc(100vh-4rem)] bg-slate-50 px-4 py-8 md:px-8">
  <div class="mx-auto flex max-w-3xl flex-col gap-6">
    <div class="rounded-3xl bg-white p-6 shadow-sm md:p-8">
      <div class="mb-5 inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-amber-100 text-amber-700">
        <lucide-icon [img]="CircleAlertIcon" class="h-7 w-7"></lucide-icon>
      </div>

      <p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-amber-700">Paiement non finalisé</p>
      <h1 class="text-2xl font-extrabold text-slate-900 md:text-3xl">L'abonnement n'a pas été activé</h1>
      <p class="mt-3 max-w-2xl text-sm leading-relaxed text-slate-600">
        Le paiement a été annulé ou n'a pas pu être validé. Vous pouvez revenir à l'application puis relancer la souscription.
      </p>

      <div class="mt-6 flex flex-wrap gap-2">
        <a
          class="inline-flex items-center rounded-xl bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700 transition"
          [routerLink]="['/properties']">
          Retour à l'application
        </a>
      </div>
    </div>
  </div>
</div>
