@if (loading) {
  <app-edit-property-skeleton></app-edit-property-skeleton>
} @else {
  <div class="p-2 md:px-48 py-4 md:py-8">
    <div class="flex items-center gap-4 mb-4 md:mb-8">
      <a
        [routerLink]="leaseId ? ['/properties', propertyId, 'lease', leaseId] : '/properties'"
        class="w-10 h-10 flex items-center justify-center bg-white bg-opacity-30 backdrop-blur-md rounded-full shadow-md hover:bg-opacity-40 transition"
      >
        <lucide-icon [img]="ArrowLeftIcon" class="w-5 h-5 text-red-500"></lucide-icon>
      </a>
      <div class="text-3xl font-bold text-gray-800">Locataires du bail</div>
    </div>

    <div class="text-sm text-slate-600 mb-4">
      Les proprietaires sont maintenant geres sur la fiche du bien.
    </div>

    <div>
      <div class="text-2xl font-bold text-gray-800 mb-4">Locataires</div>
      <div class="w-90 bg-white bg-opacity-30 backdrop-blur-md rounded-2xl p-6 shadow-lg text-gray-800" formGroupName="contractor">
        <div class="space-y-3">
          <app-text-input [label]="'Prenom'" [placeholder]="'Exemple: Sophie'" formControlName="firstName"></app-text-input>
          <app-text-input [label]="'Nom'" [placeholder]="'Exemple: Muller'" formControlName="lastName"></app-text-input>
          <app-text-input [label]="'Email'" [placeholder]="'Exemple: s.mueller@email.com'" type="email" formControlName="email"></app-text-input>
          <app-text-input [label]="'Telephone'" [placeholder]="'Exemple: +41 78 123 45 67'" formControlName="phoneNumber"></app-text-input>
        </div>
      </div>
    </div>
  </div>
}
