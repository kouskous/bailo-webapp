@if (property) {
<div
  class="bg-white bg-opacity-30 backdrop-blur-md rounded-2xl p-4 shadow-lg text-gray-800 cursor-pointer space-y-4"
  [routerLink]="['/properties', property.id]"
>
  <div class="h-32 flex justify-center">
    <img
      alt=""
      class="h-full"
      ngSrc="/illustrations/home.svg"
      height="718"
      width="850"
    />
  </div>

  <h2 class="text-xl font-bold leading-tight">{{ property.name }}</h2>

  <p class="text-sm text-gray-700 flex items-center gap-1">
    <lucide-icon [img]="MapPinIcon"></lucide-icon> {{ property.address?.label
    }}, {{ property.address?.city }}
  </p>
</div>

}
