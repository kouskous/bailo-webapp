<div class="px-2 md:px-8 py-4 md:py-8 space-y-10">

  <!-- ========================= -->
  <!-- Header propriété -->
  <!-- ========================= -->
  <div class="flex items-center gap-4">
    <div
      class="w-10 h-10 flex items-center justify-center bg-white bg-opacity-30 backdrop-blur-md rounded-full shadow-md hover:bg-opacity-40 transition cursor-pointer"
      [routerLink]="'/properties'">
      <lucide-icon [img]="ArrowLeftIcon" class="w-5 h-5 text-red-500"></lucide-icon>
    </div>

    <div>
      <div class="text-3xl font-bold text-gray-800">
        Maison Machilly
      </div>
      <div class="text-gray-700">
        244 route de Bussioz, 74140 Saint-Cergues
      </div>
    </div>
  </div>


  <div>
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold text-gray-800">
        Baux
      </h2>

      <div
        class="flex items-center gap-2 px-4 py-2 rounded-xl bg-red-500 text-white shadow-md hover:bg-red-600 transition text-sm cursor-pointer"
      >
        <lucide-icon [img]="FilePlusIcon" class="w-5 h-5"></lucide-icon>
        Nouveau bail
      </div>
    </div>
    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100">

      <!-- Bail actif -->
      <div
        class="flex items-center gap-2 px-4 py-2 rounded-xl bg-red-500 text-white text-sm shadow-md whitespace-nowrap cursor-pointer"
      >
        <lucide-icon [img]="HomeIcon" class="w-4 h-4"></lucide-icon>
        Jean Dupont
      </div>

      <!-- Autre bail actif (colocation) -->
      <div
        class="flex items-center gap-2 px-4 py-2 rounded-xl bg-red-500 text-white text-sm shadow-md whitespace-nowrap cursor-pointer"
      >
        <lucide-icon [img]="HomeIcon" class="w-4 h-4"></lucide-icon>
        Wilfried Le Blanc
      </div>

      <!-- Bail terminé -->
      <div
        class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white bg-opacity-30 backdrop-blur-md text-gray-700 text-sm hover:bg-opacity-40 transition whitespace-nowrap cursor-pointer"
      >
        <lucide-icon [img]="ArchiveIcon" class="w-4 h-4"></lucide-icon>
        Marie Martin
      </div>

    </div>
    <app-lease-summary></app-lease-summary>
  </div>




  <app-payments-schedule></app-payments-schedule>

</div>
